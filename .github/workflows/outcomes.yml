name: Outcomes progress

# Redraws the Watchtower board and the README links from Silas Portals milestones.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/update-outcomes.mjs
        env:
          # OUTCOMES_TOKEN: a fine-grained token that can read the private silas-portals repo (Issues and Metadata, read-only).
          GITHUB_TOKEN: ${{ secrets.OUTCOMES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No change"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: update outcome progress'
          git push
