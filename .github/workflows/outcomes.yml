name: Watchtower progress

on:
  pull_request:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-profile.mjs

  refresh:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: watchtower-progress
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/update-outcomes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/check-profile.mjs
      - name: Commit refreshed board
        run: |
          git add README.md assets/silas-world.svg assets/public-watchtower.svg outcomes/operations.svg
          if git diff --cached --quiet; then echo 'No change'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh watchtower progress'
          git push
