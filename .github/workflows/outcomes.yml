name: Watchtower progress

# Checks the profile on pull requests. The board itself (README.md, outcomes/, assets/) is
# refreshed by the source repo's own workflow (profile-watchtower.yml in silas-portals): the
# source is private, and only its own token can read its milestones and issues. This repo's
# token cannot, so it no longer runs update-outcomes.mjs.
on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-profile.mjs
