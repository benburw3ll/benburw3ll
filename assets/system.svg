<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" width="960" height="355" role="img" aria-label="Silas Portals: portals spawn as plugins, logic crosses between them, and Silas reaches every one" font-family="'Cascadia Code', Consolas, 'Liberation Mono', monospace"><title>Silas Portals: portals spawn as plugins, logic crosses between them, and Silas reaches every one</title><defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#fff" stroke-opacity=".035"/></pattern>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#140d10"/><stop offset="1" stop-color="#060607"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
    <rect width="960" height="355" fill="#060607"/><rect width="960" height="355" fill="url(#scan)"/>
    <rect x="1" y="1" width="958" height="353" fill="none" stroke="#6b202d" stroke-width="2"/>
    <rect x="24" y="22" width="8" height="8" fill="#f02b43"/>
    <text x="45" y="32" font-size="17" fill="#f0e6e1" font-weight="700" letter-spacing="1.3">SILAS PORTALS // THE SYSTEM</text>
    <text x="934" y="32" font-size="12" fill="#f02b43" text-anchor="end" letter-spacing="1">LOCAL FIRST · ONE HUB</text>
    <path d="M24 47L936 47" stroke="#6b202d" stroke-opacity="1" stroke-width="1"/>
    <text x="24" y="78" font-size="18" fill="#a99a9c" letter-spacing=".4">PORTALS KEEP SPAWNING, AND LOGIC RUNS BETWEEN THEM.</text>
    <rect x="24" y="105" width="278" height="212" fill="url(#panel)" stroke="#6b202d"/>
    <rect x="24" y="105" width="278" height="3" fill="#f02b43"/>
    <text x="41" y="137" font-size="13" fill="#f02b43" font-weight="700" letter-spacing="1">[ 01 ]  PORTALS</text>
    <g fill="none" stroke="#f02b43"><path d="M228 173V145a12 12 0 0 1 24 0V173z"/><path d="M258 173V153a10 10 0 0 1 20 0V173z" stroke-dasharray="3 3"/><path d="M222 173h62"/></g>
    <text x="41" y="199" font-size="20" fill="#f0e6e1" font-weight="700">No fixed set</text>
    <text x="41" y="236" font-size="13" fill="#a99a9c" >Every portal is a plugin.</text><text x="41" y="259" font-size="13" fill="#a99a9c" >The desktop widgets came</text><text x="41" y="282" font-size="13" fill="#a99a9c" >first. More keep coming.</text>
    <rect x="341" y="105" width="278" height="212" fill="url(#panel)" stroke="#6b202d"/>
    <rect x="341" y="105" width="278" height="3" fill="#f02b43"/>
    <text x="358" y="137" font-size="13" fill="#f02b43" font-weight="700" letter-spacing="1">[ 02 ]  LOGIC</text>
    <g fill="none" stroke="#f02b43"><circle cx="551" cy="140" r="5"/><circle cx="587" cy="166" r="5"/><path d="M556 140h16v26h10M567 135l5 5-5 5"/></g>
    <text x="358" y="199" font-size="20" fill="#f0e6e1" font-weight="700">Cross the realms</text>
    <text x="358" y="236" font-size="13" fill="#a99a9c" >One core under every portal,</text><text x="358" y="259" font-size="13" fill="#a99a9c" >so an event in one realm</text><text x="358" y="282" font-size="13" fill="#a99a9c" >can act in another.</text>
    <rect x="658" y="105" width="278" height="212" fill="url(#panel)" stroke="#6b202d"/>
    <rect x="658" y="105" width="278" height="3" fill="#f02b43"/>
    <text x="675" y="137" font-size="13" fill="#f02b43" font-weight="700" letter-spacing="1">[ 03 ]  SILAS</text>
    <g fill="none" stroke="#f02b43"><rect x="869" y="128" width="34" height="48" rx="4"/><path d="M876 142h20M876 149h14M876 156h18"/></g>
    <text x="675" y="199" font-size="20" fill="#f0e6e1" font-weight="700">Just ask Silas</text>
    <text x="675" y="236" font-size="13" fill="#a99a9c" >Silas reaches every portal:</text><text x="675" y="259" font-size="13" fill="#a99a9c" >ask about your day or change</text><text x="675" y="282" font-size="13" fill="#a99a9c" >something from Telegram.</text>
    <text x="24" y="341" font-size="10" fill="#594c50" letter-spacing="1">01/03  ·  SPAWN</text>
    <text x="478" y="341" font-size="10" fill="#594c50" text-anchor="middle" letter-spacing="1">02/03  ·  CONNECT</text>
    <text x="936" y="341" font-size="10" fill="#594c50" text-anchor="end" letter-spacing="1">03/03  ·  ASK</text>
  </svg>