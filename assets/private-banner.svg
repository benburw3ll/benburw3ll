<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Private until v1 for development and penetration testing. Three imaginary friends test the Overlord Watchtower across a canyon while an evil imaginary friend tries to hack it and is denied." font-family="'Cascadia Code', Consolas, 'Liberation Mono', monospace">
  <title>Private until v1: the imaginary friends test the Overlord Watchtower</title>
